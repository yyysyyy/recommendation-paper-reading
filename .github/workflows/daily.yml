name: Daily digest and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      collect:
        description: 'Fetch arXiv and call LLM (false = deploy existing archive only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-pages-production
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate and test before using secrets
        run: |
          python -m unittest discover -s tests -v
          python -m pipeline.cli validate
      - name: Collect and review (all or nothing)
        if: github.event_name == 'workflow_dispatch' && inputs.collect && vars.ENABLE_API_COLLECTOR == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        run: python -m pipeline.cli update
      - name: Reject an API run that was not enabled
        if: github.event_name == 'workflow_dispatch' && inputs.collect && vars.ENABLE_API_COLLECTOR != 'true'
        run: |
          echo 'API collection is disabled. Codex maintains this archive. See README for optional API setup.'
          exit 1
      - name: Validate and build before committing
        run: |
          python -m pipeline.cli validate
          python -m pipeline.cli build
      - name: Commit the complete data transaction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.jsonl data/days.json data/evaluations.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish recommendation digest"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - name: Success summary
        run: echo 'Static archive validated. Deploy job will publish this exact artifact.' >> "$GITHUB_STEP_SUMMARY"
      - name: Failure summary
        if: failure()
        run: echo 'Run failed. No new Pages artifact will be deployed; last successful site remains available. Inspect failed step and rerun after fixing.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
